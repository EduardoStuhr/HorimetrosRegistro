name: TRANSJAP CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  qualidade_e_build:
    name: Lint, Testes Automatizados e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar Dependências
        run: bun install --frozen-lockfile

      - name: Executar Lint e Checagem de Tipos TypeScript
        run: bun run lint

      - name: Executar Bateria de Testes de Qualidade (Unidade, Regras, Idempotência)
        run: bunx tsx -e "import('./src/services/tests').then(m => m.executarBateriaTestesQualidade()).then(res => { const falhas = res.filter(r => !r.passou); if (falhas.length > 0) { console.error('Falhas encontradas:', falhas); process.exit(1); } else { console.log('Todos os ' + res.length + ' testes passaram com sucesso!'); } })"

      - name: Build do Projeto de Produção
        run: bun run build
