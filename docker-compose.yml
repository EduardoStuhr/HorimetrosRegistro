version: '3.8'

services:
  # 1. Banco de Dados Relacional
  postgres:
    image: postgres:16-alpine
    container_name: transjap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-transjap_horimetro}
      POSTGRES_USER: ${DB_USER:-transjap_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-senha_forte_transjap_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./drizzle/migrations/0000_transjap_init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-transjap_admin} -d ${DB_NAME:-transjap_horimetro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Servidor Monolítico da API e Painel
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transjap-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-transjap_admin}:${DB_PASSWORD:-senha_forte_transjap_2026}@postgres:5432/${DB_NAME:-transjap_horimetro}
      S3_BUCKET: ${S3_BUCKET:-transjap-horimetros}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-chave_secreta_jwt_admin_transjap}
    ports:
      - "3000:3000"

  # 3. Servidor Web Reverso Caddy com HTTPS Automático
  caddy:
    image: caddy:2-alpine
    container_name: transjap-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
